[project]
name = "eden"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
    "cryptography>=44.0.0",
    "fastapi[standard]>=0.139.2",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

# formatter (black-compatible) — รัน `uv run ruff format` · เช็ค `uv run ruff format --check`
# import sorting / lint เพิ่มได้ทีหลังด้วย `ruff check --select I` (ตอนนี้ pyright ทำ type/unused แล้ว)
[tool.ruff]
line-length = 88
target-version = "py313"
