services:
  postgres:
    image: postgres:16.15
    container_name: eden-postgres
    restart: unless-stopped
    environment:
      # ค่าจาก .env ที่ root (ดู .env.example) — มี default สำหรับ dev
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-EDEN_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # named volume (Docker จัดการเอง) — ทนกว่า bind mount บน Windows
      # ลบเฉพาะเมื่อสั่ง `docker compose down -v` หรือ `docker volume rm` เท่านั้น
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-EDEN_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eden-network

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: eden-pgadmin
    restart: unless-stopped
    profiles: ["tools"]   # ไม่ start ตอน `docker compose up` ปกติ — ใช้ `--profile tools`
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      # ลงทะเบียน server EDEN ให้อัตโนมัติ (ไม่ต้อง add เองทุกครั้ง)
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eden-network

  backend:
    build: ./backend-eden
    container_name: eden-backend
    restart: unless-stopped
    # dev: hot reload — แก้ .py แล้ว uvicorn รีโหลดเอง (ไม่ต้อง restart container)
    # migration ยังรันตอน container start เท่านั้น → migration ใหม่ยังต้อง `docker compose restart backend`
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # ต่อ DB ผ่านชื่อ service ภายใน network (พอร์ตภายในคือ 5432)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-EDEN_DB}
      # Docker Desktop (Windows/Mac) — file event ไม่ propagate ผ่าน bind mount ต้อง poll
      WATCHFILES_FORCE_POLLING: "true"
    # คีย์ลับ (SECRET_KEY ฯลฯ) อ่านจากไฟล์ตอน compose up — ไม่ถูกฝังใน image
    env_file:
      - path: ./backend-eden/.env
        required: false
    volumes:
      - ./backend-eden:/app             # map โค้ดเข้าไป (hot reload ผ่าน --reload ได้)
      - /app/.venv                      # กัน .venv ในเครื่องไปทับของใน container
      - ./backend-eden/uploads:/app/uploads  # ไฟล์อัปโหลดอยู่นอก image (prod: เปลี่ยนเป็น named volume)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eden-network

  frontend:
    build:
      context: ./frontend-eden
      target: dev   # Dockerfile หลายสเตจ — dev = Vite dev server (prod ใช้ docker-compose.prod.yml)
      args:
        # base URL ที่ browser ใช้เรียก backend — ตั้งผ่าน VITE_API_BASE ใน .env ที่ root
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    container_name: eden-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend-eden:/app               # Map ไฟล์ในเครื่องเรา เข้าไปใน /app ของ Container
      - /app/node_modules    # ป้องกันไม่ให้ node_modules ในเครื่องไปทับใน Container
    environment:
      - CHOKIDAR_USEPOLLING=true # ช่วยให้ Hot Reload ทำงานได้ดีขึ้นบนบาง OS (เช่น Windows WSL)
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000} # dev server อ่านค่านี้ตอน start
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eden-network

networks:
  eden-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
