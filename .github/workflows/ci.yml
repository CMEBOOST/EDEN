name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-eden
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: EDEN_DB
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d EDEN_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Type check (pyright)
        run: uvx pyright

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:admin123@localhost:5432/EDEN_DB
        run: uv run alembic upgrade head

      - name: Validate compose files + scripts
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_PASSWORD: ci-check
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
          bash -n scripts/backup.sh scripts/restore.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-eden
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20"
          cache: npm
          cache-dependency-path: frontend-eden/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/

      - name: Build
        run: npx vite build
