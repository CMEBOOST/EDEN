# nginx สำหรับ prod — เสิร์ฟ SPA (static) + proxy /api/ ไป backend (single origin)
server {
  listen 80;
  server_name _;

  # อัปโหลดไฟล์ได้ถึง 10 MB (backend จำกัด 10) — เผื่อ overhead
  client_max_body_size 12M;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # asset ที่มี hash ในชื่อ — cache ยาว
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API → backend (ตัด prefix /api ออกด้วย trailing slash ใน proxy_pass)
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — deep link (/contracts ฯลฯ) ต้องได้ index.html
  location / {
    try_files $uri /index.html;
  }
}
